apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: library-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: library-app-library-api
      name: http
      visibility: project
      envBindings:
        address: LIBRARY_API_URL
    - component: library-app-library-agent
      name: http
      visibility: project
      envBindings:
        address: LIBRARY_AGENT_URL
  resources:
    - ref: library-app-user-auth
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
