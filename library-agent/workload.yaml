apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: library-agent

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - internal
      - external

dependencies:
  endpoints:
    - component: library-app-library-api
      name: http
      visibility: project
      envBindings:
        address: LIBRARY_API_URL
  resources:
    - ref: library-app-user-auth
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
    - ref: library-app-libra-d76f7ced
      envBindings:
        dbname: LIBRARY_AGENT_MEMORY_DB_DBNAME
        host: LIBRARY_AGENT_MEMORY_DB_HOST
        password: LIBRARY_AGENT_MEMORY_DB_PASSWORD
        port: LIBRARY_AGENT_MEMORY_DB_PORT
        user: LIBRARY_AGENT_MEMORY_DB_USER
